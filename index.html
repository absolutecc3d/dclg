<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --card: #232428;
    --field: #1a1b1e;
    --text: #f2f3f5;
    --muted: #b5bac1;
    --label: #b5bac1;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --link: #00a8fc;
    --danger: #fa777c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-weight: 400;
    color: var(--text);
    /* Swap bg.svg for your own image. */
    background: #14123a url("bg.svg") center / cover no-repeat fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden; min-height: 100vh;
  }

  .brand {
    position: fixed; top: 32px; left: 48px; z-index: 2;
    height: 28px; width: auto; display: block;
  }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px;
    background: var(--card); border-radius: 6px;
    padding: 32px 48px;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }

  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 400; text-align: center; }
  .sub { margin: 0 0 20px; text-align: center; color: var(--muted); font-size: 16px; }

  label {
    display: block; margin: 20px 0 8px; font-size: 12px; font-weight: 400;
    text-transform: uppercase; letter-spacing: .02em; color: var(--label);
  }
  label .req { color: var(--danger); }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; height: 44px; padding: 10px; font-size: 16px; font-weight: 400;
    background: var(--field); color: var(--text);
    border: 1px solid #0e0f11; border-radius: 3px; font-family: inherit; outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--link); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .forgot { display: inline-block; margin: 4px 0 0; font-size: 14px; }

  .submit {
    width: 100%; height: 44px; margin-top: 20px;
    background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 400;
    border: 0; border-radius: 3px; cursor: pointer; transition: background .17s;
  }
  .submit:hover { background: var(--accent-hover); }
  .submit:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .register { margin-top: 8px; font-size: 14px; color: #949ba4; }
  .error { display: none; margin-top: 12px; color: var(--danger); font-size: 14px; }
  .error.show { display: block; }
  .error:empty { display: none; }

  @media (max-width: 820px) {
    body { flex-direction: column; justify-content: center; }
    .brand { position: static; margin-bottom: 20px; align-self: flex-start; }
    .card { padding: 24px; }
  }
</style>
</head>
<body>
  <!-- Swap logo.svg for your own logo. -->
  <img class="brand" src="logo.svg" alt="yoursite">

  <form class="card" id="login" novalidate>
    <h1>Welcome back</h1>
    <p class="sub">Good to see you again.</p>

    <label for="id">Email or username <span class="req">*</span></label>
    <input id="id" name="id" type="text" autocomplete="username" required>

    <label for="pw">Password <span class="req">*</span></label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" required>
    <a class="forgot" href="/forgot">Forgot your password?</a>

    <div class="error" id="err" role="alert" aria-live="polite"></div>
    <button class="submit" type="submit">Log in</button>
    <div class="register">Need an account? <a href="/register">Register</a></div>
  </form>

<script>
  const form = document.getElementById('login');
  const usernameField = document.getElementById('id');
  const passwordField = document.getElementById('pw');
  const errorMessage = document.getElementById('err');

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    const username = usernameField.value.trim();
    const password = passwordField.value;

    if (!username || !password.trim()) {
      errorMessage.textContent = 'Fill in both fields.';
      errorMessage.classList.add('show');
      (!username ? usernameField : passwordField).focus();
      return;
    }

    errorMessage.textContent = 'Demo only: no login request was sent. Connect this form to a secure authentication server.';
    errorMessage.classList.add('show');
    // Intentionally do not transmit, log, or otherwise use the entered credentials.
  });
</script>
</body>
</html>

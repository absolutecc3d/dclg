<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --card: #232428;
    --field: #1a1b1e;
    --text: #f2f3f5;
    --muted: #b5bac1;
    --label: #b5bac1;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --link: #00a8fc;
    --danger: #fa777c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Google Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    /* swap bg.jpg for your own image */
    background: #14123a url("bg.jpg") center / cover no-repeat fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden; min-height: 100vh;
  }

  .brand {
    position: fixed; top: 32px; left: 48px; z-index: 2;
    height: 40px; width: auto; display: block;
  }

  /* ---- card ---- */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 784px;
    background: var(--card); border-radius: 5px;
    padding: 32px; display: flex; gap: 0;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }
  .main { flex: 0 0 416px; max-width: 416px; }
  .side {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding-left: 48px;
  }

  .back {
    display: inline-flex; align-items: center; gap: 8px;
    background: #2e3035; color: var(--text); border: 0; border-radius: 4px;
    padding: 0 16px; height: 38px; font: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; text-decoration: none;
  }
  .back:hover { background: #393c43; text-decoration: none; }
  .back svg { width: 14px; height: 14px; }

  h1 { margin: 22px 0 8px; font-size: 24px; font-weight: 700; text-align: center; }
  .sub { margin: 0 0 20px; text-align: center; color: var(--muted); font-size: 16px; }

  label {
    display: block; margin: 20px 0 8px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .02em; color: var(--label);
  }
  label .req { color: var(--danger); }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; height: 44px; padding: 10px; font-size: 16px;
    background: var(--field); color: var(--text);
    border: 1px solid #0e0f11; border-radius: 3px; font-family: inherit; outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--link); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .forgot { display: inline-block; margin: 4px 0 0; font-size: 14px; }

  .submit {
    width: 100%; height: 44px; margin-top: 20px;
    background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 500;
    border: 0; border-radius: 3px; cursor: pointer; transition: background .17s;
  }
  .submit:hover { background: var(--accent-hover); }
  .register { margin-top: 8px; font-size: 14px; color: #949ba4; }
  .error { display: none; margin-top: 12px; color: var(--danger); font-size: 14px; }
  .error.show { display: block; }

  .qr {
    width: 176px; height: 176px; border-radius: 4px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 13px; padding: 12px;
  }
  .side h2 { margin: 28px 0 8px; font-size: 24px; font-weight: 700; }
  .side p { margin: 0 0 8px; color: var(--muted); font-size: 16px; line-height: 20px; max-width: 240px; }
  .side p b { color: var(--text); font-weight: 700; }
  .side a { font-size: 14px; }

  @media (max-width: 820px) {
    body { flex-direction: column; justify-content: center; }
    .brand { position: static; margin-bottom: 20px; align-self: flex-start; }
    .side { display: none; }
    .main { flex: 1 1 auto; max-width: none; }
    .card { padding: 24px; max-width: 480px; }
  }
</style>
</head>
<body>
  <!-- swap logo.png for your own logo -->
  <img class="brand" src="logo.png" alt="yoursite">

  <form class="card" id="login" novalidate>
    <div class="main">
      <a class="back" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        Go back
      </a>
      <h1>Welcome back</h1>
      <p class="sub">Good to see you again.</p>

      <label for="id">Email or username <span class="req">*</span></label>
      <input id="id" name="id" type="text" autocomplete="username" required>

      <label for="pw">Password <span class="req">*</span></label>
      <input id="pw" name="pw" type="password" autocomplete="current-password" required>
      <a class="forgot" href="/forgot">Forgot your password?</a>

      <div class="error" id="err">Fill in both fields.</div>
      <button class="submit" type="submit">Log in</button>
      <div class="register">Need an account? <a href="/register">Register</a></div>
    </div>

    <div class="side">
      <!-- drop a real QR in here with a qr library if you want QR login -->
      <div class="qr" id="qr">QR code goes here</div>
      <h2>Log in with QR code</h2>
      <p>Scan this with the <b>mobile app</b> to log in instantly.</p>
      <a href="/passkey">Or sign in with a passkey</a>
    </div>
  </form>

<script>
  document.getElementById('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('id').value.trim();
    var pw = document.getElementById('pw').value;
    var err = document.getElementById('err');
    if (!id || !pw) { err.classList.add('show'); return; }
    err.classList.remove('show');
    // TODO: hook up your real auth here
    console.log('login attempt', id);
  });
</script>
</body>
</html>
